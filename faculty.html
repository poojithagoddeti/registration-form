<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Registration Form</title>
</head>
<body>

    <h2 align="center">Faculty Registration Form</h2>

    <form>

        <label>Faculty ID:</label><br>
        <input type="text" name="facultyId" required><br><br>

        <label>Full Name:</label><br>
        <input type="text" name="fullName" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" required><br><br>

        <label>Department:</label><br>
        <select name="department">
            <option value="">--Select Department--</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>IT</option>
        </select>
        <br><br>

        <label>Highest Qualification:</label><br>
        <select name="qualification">
            <option value="">--Select Qualification--</option>
            <option>B.Tech</option>
            <option>M.Tech</option>
            <option>M.Sc</option>
            <option>Ph.D</option>
        </select>
        <br><br>

        <label>Years of Experience:</label><br>
        <input type="number" name="experience" min="0"><br><br>

        <label>Subjects Teaching:</label><br>
        <input type="text" name="subjects"><br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <label>Joining Date:</label><br>
        <input type="date" name="joiningDate"><br><br>

        <label>Upload Resume:</label><br>
        <input type="file" name="resume"><br><br>

        <input type="checkbox" required>
        I confirm that the above information is correct.
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
